  socialIcons:
    - name: "email"
      url: "mailto:pandirabhishek2001@gmail.com"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/abhishekpandir/"
    - name: "github"
      url: "https://github.com/pandirabhishek"

  # text search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

