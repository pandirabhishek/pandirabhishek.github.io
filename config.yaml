params:
  # theme
  showToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideMeta: false
  # for enchanced SEO
  env: production
  homeInfoParams:
    Title: I build benchmark datasets and observability for AI agents.
    Content: |
      I’m an ML Research Engineer building benchmark datasets and observability systems for agentic evaluation, extraction pipelines, and reliable RAG.

      At [Sirion](/experience/sirion-mle/), I build legal-AI golden datasets and [Auto-Eval](/projects/agentic-eval-platform/) with end-to-end pipeline observability, trajectory/tool scoring, LLM-as-judge evaluation, regression gates, and failure analysis. Impact: 6.5k-question dataset, dense retrieval recall **0.38 → 0.91**, and dense/sparse embedding models.

      Previously at [Sprinklr](/experience/sprinklr-ds/), I fine-tuned LLaMA, Phi, and Mistral models and shipped sentiment, moderation, and RAG summarization systems—reducing inference memory **60–70%** and doubling speed.
  # Home Page
  profileMode:
    enabled: false
    title: "Abhishek Pandir"
    subtitle: I’m an ML Research Engineer building benchmark datasets, agentic evaluations, extraction-pipeline observability, and reliable RAG systems. At Sirion Foundry, I also research dense and sparse embedding models.
    imageUrl: "home/casual.jpeg"
    imageWidth: 200
    imageHeight: 220
    buttons:
      - name: Resume
        url: ""
      - name: Blog
        url: /blog

  # List View
  hideDescriptionInList: false

  socialIcons:
    - name: "email"
      url: "mailto:pandirabhishek2001@gmail.com"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/abhishekpandir/"
    - name: "github"
      url: "https://github.com/pandirabhishek"

  # text search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# for search using Fuse.js
outputs:
  home:
    - HTML
    - JSON


# allow HTML in MD
markup:
  goldmark:
    renderer:
      unsafe: true




