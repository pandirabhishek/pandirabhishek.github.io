baseURL: "https://pandirabhishek.github.io/"
languageCode: en-us
title: Abhishek Pandir
theme: PaperMod
disableKinds:
  - taxonomy
  - term
mainsections : ['posts', 'projects', 'publications']
menu:
  main:
    - identifier: Posts
      name: Posts
      url: /posts
      weight: 20
    - identifier: projects
      name: Projects
      url: /projects
      weight: 30
    - identifier: publications
      name: Publications
      url: /publications
      weight: 35
    - identifier: experience
      name: Experience
      url: /experience
      weight: 40
    - identifier: search
      name: Search
      url: /search
      weight: 50
    # - identifier: tags
    #   name: Tags
    #   url: /tags
    #   weight: 60
    # - identifier: notes
    #   name: Notes
    #   url: https://notes.arkalim.org
    #   weight: 70

params:
  # theme
  defaultTheme: auto
  showToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideMeta: false
  # for enchanced SEO
  env: production
  profileMode:
    enabled: true
    title: "Abhishek Pandir"
    subtitle: |
      ML Research Engineer — benchmark datasets, agentic evaluation, and reliable RAG.

      Building legal-AI golden datasets and [Auto-Eval](/projects/agentic-eval-platform/) at [Sirion](/experience/sirion-mle/). Dense retrieval recall **0.38 → 0.91** on a 6.5k-question dataset.
    buttons:
      - name: Resume
        url: /resume.pdf
      - name: Posts
        url: /posts
      - name: Projects
        url: /projects
      - name: Experience
        url: /experience

  # List View
  hideDescriptionInList: false

  socialIcons:
    - name: "email"
      url: "mailto:pandirabhishek2001@gmail.com"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/abhishekpandir/"
    - name: "github"
      url: "https://github.com/pandirabhishek"

  # text search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# for search using Fuse.js
outputs:
  home:
    - HTML
    - JSON


# allow HTML in MD
markup:
  goldmark:
    renderer:
      unsafe: true




googleAnalytics: G-N7N69N17K1
analytics:
    google:
        SiteVerificationTag: "G-N7N69N17K1"
